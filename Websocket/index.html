<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastAPI WebSocket Chat</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            height: 100vh;
        }

        /* HEADER */

        .header {
            height: 70px;

            background: #2563eb;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }


        /* CHAT CONTAINER */

        .chat-container {

            display: flex;

            gap: 20px;

            padding: 20px;

            height: calc(100vh - 70px);
        }


        /* USER BOX */

        .user-box {

            flex: 1;

            background: white;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }


        /* USER HEADER */

        .user-header {

            padding: 18px;

            color: white;

            font-size: 20px;

            font-weight: bold;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .user1-header {
            background: #16a34a;
        }


        .user2-header {
            background: #9333ea;
        }


        /* ONLINE STATUS */

        .status {

            font-size: 13px;

            background: #ffffff33;

            padding: 5px 10px;

            border-radius: 20px;
        }


        /* MESSAGES */

        .messages {

            flex: 1;

            padding: 20px;

            overflow-y: auto;

            background: #f8fafc;
        }


        .message {

            margin-bottom: 12px;

            padding: 10px 14px;

            border-radius: 12px;

            max-width: 75%;

            word-wrap: break-word;
        }


        .user1-message {

            background: #dcfce7;

            margin-left: auto;
        }


        .user2-message {

            background: #ede9fe;

            margin-right: auto;
        }


        /* INPUT */

        .input-area {

            display: flex;

            padding: 15px;

            border-top: 1px solid #ddd;

            gap: 10px;
        }


        .input-area input {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            outline: none;

            font-size: 15px;
        }


        .input-area input:focus {

            border-color: #2563eb;
        }


        /* BUTTON */

        button {

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .user1-button {

            background: #16a34a;
        }


        .user2-button {

            background: #9333ea;
        }


        button:hover {

            opacity: 0.85;
        }


        /* NOTIFICATION POPUP */

        .notification {

            position: fixed;

            top: 90px;

            right: 25px;

            width: 320px;

            background: white;

            border-radius: 12px;

            padding: 18px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);

            display: none;

            z-index: 1000;

            border-left: 5px solid #2563eb;

            animation: slideIn 0.4s ease;
        }


        .notification-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .notification-message {

            color: #475569;

            font-size: 14px;
        }


        .notification-close {

            position: absolute;

            top: 8px;

            right: 12px;

            color: #64748b;

            cursor: pointer;

            font-size: 18px;
        }


        @keyframes slideIn {

            from {

                transform: translateX(100%);

                opacity: 0;
            }

            to {

                transform: translateX(0);

                opacity: 1;
            }

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .chat-container {

                flex-direction: column;

                height: auto;
            }


            .user-box {

                min-height: 500px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        💬 FastAPI WebSocket Chat

    </div>



    <!-- CHAT -->

    <div class="chat-container">


        <!-- USER 1 -->

        <div class="user-box">


            <div class="user-header user1-header">

                <span>👤 User 1</span>

                <span
                    id="status1"
                    class="status"
                >
                    Connecting...
                </span>

            </div>


            <div
                id="messages1"
                class="messages"
            ></div>


            <div class="input-area">

                <input
                    id="input1"
                    type="text"
                    placeholder="Type message..."
                    onkeypress="handleEnter(event, 1)"
                >


                <button
                    class="user1-button"
                    onclick="sendMessage(1)"
                >
                    Send
                </button>

            </div>


        </div>



        <!-- USER 2 -->

        <div class="user-box">


            <div class="user-header user2-header">

                <span>👤 User 2</span>

                <span
                    id="status2"
                    class="status"
                >
                    Connecting...
                </span>

            </div>


            <div
                id="messages2"
                class="messages"
            ></div>


            <div class="input-area">

                <input
                    id="input2"
                    type="text"
                    placeholder="Type message..."
                    onkeypress="handleEnter(event, 2)"
                >


                <button
                    class="user2-button"
                    onclick="sendMessage(2)"
                >
                    Send
                </button>

            </div>


        </div>


    </div>



    <!-- POPUP NOTIFICATION -->

    <div
        id="notification"
        class="notification"
    >

        <span
            class="notification-close"
            onclick="closeNotification()"
        >
            ✕
        </span>


        <div
            id="notificationTitle"
            class="notification-title"
        >
            🔔 New Message
        </div>


        <div
            id="notificationMessage"
            class="notification-message"
        >
        </div>

    </div>



<script>


    let socket1;

    let socket2;



    // =====================================
    // USER 1 CONNECTION
    // =====================================

    function connectUser1() {


        socket1 = new WebSocket(
            "ws://127.0.0.1:8000/ws/user1"
        );


        socket1.onopen = function() {

            document.getElementById("status1").innerText =
                "🟢 Online";

        };


        socket1.onmessage = function(event) {


            // Add message to User 1

            addMessage(
                1,
                event.data,
                "user2-message"
            );


            // Show popup

            showNotification(
                "User 1",
                event.data
            );


            // Browser notification

            browserNotification(
                "User 1",
                event.data
            );

        };


        socket1.onclose = function() {

            document.getElementById("status1").innerText =
                "🔴 Offline";

        };

    }



    // =====================================
    // USER 2 CONNECTION
    // =====================================

    function connectUser2() {


        socket2 = new WebSocket(
            "ws://127.0.0.1:8000/ws/user2"
        );


        socket2.onopen = function() {

            document.getElementById("status2").innerText =
                "🟢 Online";

        };


        socket2.onmessage = function(event) {


            // Add message to User 2

            addMessage(
                2,
                event.data,
                "user1-message"
            );


            // Show popup

            showNotification(
                "User 2",
                event.data
            );


            // Browser notification

            browserNotification(
                "User 2",
                event.data
            );

        };


        socket2.onclose = function() {

            document.getElementById("status2").innerText =
                "🔴 Offline";

        };

    }



    // =====================================
    // SEND MESSAGE
    // =====================================

    function sendMessage(user) {


        let input;


        // USER 1

        if (user === 1) {


            input =
                document.getElementById("input1");


            if (input.value.trim() !== "") {


                socket1.send(input.value);


                addMessage(
                    1,
                    "You: " + input.value,
                    "user1-message"
                );


                input.value = "";

            }

        }



        // USER 2

        if (user === 2) {


            input =
                document.getElementById("input2");


            if (input.value.trim() !== "") {


                socket2.send(input.value);


                addMessage(
                    2,
                    "You: " + input.value,
                    "user2-message"
                );


                input.value = "";

            }

        }

    }



    // =====================================
    // ADD MESSAGE
    // =====================================

    function addMessage(
        user,
        message,
        className
    ) {


        let container;


        if (user === 1) {

            container =
                document.getElementById("messages1");

        } else {

            container =
                document.getElementById("messages2");

        }


        let div =
            document.createElement("div");


        div.className =
            "message " + className;


        div.innerText =
            message;


        container.appendChild(div);


        container.scrollTop =
            container.scrollHeight;

    }



    // =====================================
    // SHOW POPUP
    // =====================================

    function showNotification(
        user,
        message
    ) {


        document.getElementById(
            "notificationTitle"
        ).innerText =
            "🔔 New Message from " + user;


        document.getElementById(
            "notificationMessage"
        ).innerText =
            message;


        document.getElementById(
            "notification"
        ).style.display =
            "block";


        // Automatically hide after 4 seconds

        setTimeout(
            closeNotification,
            4000
        );

    }



    // =====================================
    // CLOSE POPUP
    // =====================================

    function closeNotification() {


        document.getElementById(
            "notification"
        ).style.display =
            "none";

    }



    // =====================================
    // BROWSER NOTIFICATION
    // =====================================

    function browserNotification(
        user,
        message
    ) {


        // Check browser support

        if (!("Notification" in window)) {

            return;

        }


        // Ask permission

        if (Notification.permission === "default") {


            Notification.requestPermission()
                .then(function(permission) {


                    if (permission === "granted") {

                        new Notification(
                            "💬 Message from " + user,
                            {
                                body: message
                            }
                        );

                    }

                });

        }


        // Already allowed

        else if (
            Notification.permission === "granted"
        ) {


            new Notification(
                "💬 Message from " + user,
                {
                    body: message
                }
            );

        }

    }



    // =====================================
    // ENTER KEY
    // =====================================

    function handleEnter(
        event,
        user
    ) {


        if (event.key === "Enter") {

            sendMessage(user);

        }

    }



    // =====================================
    // START
    // =====================================

    connectUser1();

    connectUser2();


</script>


</body>

</html>
